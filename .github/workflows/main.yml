name: validate-security-multi-agent
on:
  workflow_dispatch: # Allows manual trigger to test the run

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: 7b3e9122-ff26-4610-be9b-7819c74fecf4 # App ID for acphf-agent-1
          tenant-id: 9439dd25-f3b5-4829-a76f-5ede8cd54c3c
          subscription-id: d5ffd8a5-d994-4eb5-b87c-4442054d233e # Target Scope from Phase 4
          
      - name: Verify Key Vault Data-Plane Access
        run: |
          az keyvault secret show --name "ACPHF-OIDC-Success" --vault-name "KV-SECURE-DATA" --query "value" -o tsv
          
      - name: Post-Execution & Session Teardown
        run: az account clear
