name: Validate OIDC & Data-Plane Isolation

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'  # Automatically runs every 60 minutes
  workflow_dispatch:      # Allows manual triggers anytime

permissions:
  id-token: write  # Required for requesting the OIDC JWT token
  contents: read   # Required for checking out code

jobs:
  validate-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Key Vault Data-Plane Access
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Attempting data-plane secret retrieval from KV-Secure-Data..."
            SECRET_VAL=$(az keyvault secret show --name "TestSecret" --vault-name "KV-Secure-Data" --query "value" -o tsv)
            echo "Successfully retrieved secret value: $SECRET_VAL"
