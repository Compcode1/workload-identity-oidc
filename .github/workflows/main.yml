name: Validate OIDC & Data-Plane Isolation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Direct OIDC Login & Debug
        run: |
          echo "Fetching GitHub OIDC Token..."
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" == "null" ]; then
            echo "ERROR: Failed to obtain OIDC token from GitHub runtime."
            exit 1
          fi
          echo "OIDC Token retrieved successfully."

          echo "Attempting Direct Azure CLI OIDC Login..."
          az login --service-principal \
            --client-id "e7e0822c-a39c-4325-8fec-25b014fcb0c3" \
            --tenant "9439dd25-f3b5-4829-a76f-5ede8cd54c3c" \
            --federated-token "$OIDC_TOKEN" \
            --debug

      - name: Verify Key Vault Access
        run: |
          az keyvault secret show --name "TestSecret" --vault-name "KV-Secure-Data" --query "value" -o tsv
