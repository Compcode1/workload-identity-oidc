name: Validate OIDC & Data-Plane Isolation

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: "e7e0822c-a39c-4325-8fec-25b014fcb0c3"
          tenant-id: "9439dd25-f3b5-4829-a76f-5ede8cd54c3c"
          subscription-id: "d5ffd8a5-d994-4eb5-b87c-4442054d233e"

      - name: Verify Key Vault Data-Plane Access
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Attempting data-plane secret retrieval from KV-Secure-Data..."
            SECRET_VAL=$(az keyvault secret show --name "TestSecret" --vault-name "KV-Secure-Data" --query "value" -o tsv)
            echo "Successfully retrieved secret value: $SECRET_VAL"
